<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

  <!-- PWA Meta -->
  <meta name="theme-color" content="#0D0D0D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ESSĒRE" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />

  <title>ESSĒRE</title>
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #0D0D0D; }

    /* Safe area padding for PWA standalone on notched iPhones */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #tab-bar-bottom {
        padding-bottom: env(safe-area-inset-bottom) !important;
      }
    }

    /* Ionicons font - served locally to avoid CDN/CORS issues on iOS Safari */
    /* Expo/react-native-vector-icons uses lowercase 'ionicons' as font-family */
    @font-face {
      font-family: 'Ionicons';
      src: url('/Ionicons.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'ionicons';
      src: url('/Ionicons.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
  </style>
  <link rel="preload" href="/Ionicons.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
  <script>
    // Force-load Ionicons font via FontFace API for all browsers (including iOS Safari)
    // This ensures the font is registered and downloading before JS bundle executes
    (function() {
      if (typeof FontFace !== 'undefined') {
        var names = ['Ionicons', 'ionicons'];
        var promises = [];
        names.forEach(function(name) {
          var font = new FontFace(name, 'url(/Ionicons.ttf)', {
            weight: 'normal',
            style: 'normal',
            display: 'block'
          });
          promises.push(
            font.load().then(function(loaded) {
              document.fonts.add(loaded);
            }).catch(function(err) {
              console.warn(name + ' font load failed:', err);
            })
          );
        });
        // Store promise globally so App.tsx can await it
        window.__ioniconsReady = Promise.all(promises);
      } else {
        window.__ioniconsReady = Promise.resolve();
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Qui viveva una rete di sicurezza: «se l'App non parte entro 8
    secondi, svuota le cache e ricarica». Sembrava una protezione, e
    per mesi tutti l'abbiamo creduta attiva.

    NON È MAI ARRIVATA IN PRODUZIONE. Expo genera `dist/index.html`
    da sé: questo file non è il sorgente della pagina, è la copia
    leggibile. In produzione finisce solo ciò che `postbuild-web.js`
    inietta — e quel blocco lì non c'era. `App.tsx` chiamava
    `window.__markAppLoaded()`, una funzione che sul sito vero non
    è mai esistita.

    Aveva anche due difetti suoi: si fidava di un segnale che l'App
    doveva ricordarsi di mandare, invece di guardare se la schermata
    era davvero piena; e se una delle pulizie falliva, la catena
    moriva zitta senza ricaricare niente.

    La rete nuova sta in fondo a questo file E in postbuild-web.js,
    guarda il DOM invece di un flag, e ricarica comunque se le
    pulizie si piantano. Un test verifica che le due copie non
    divergano — perché è esattamente così che è nato questo buco.
  -->
  <script>
    // ============================================================
    // AGGIORNAMENTO — dirlo, invece di sperare in un ricaricamento
    // ------------------------------------------------------------
    // Il 12 settembre 2026 il titolare ha guardato una schermata senza
    // il pulsante che gli avevo appena pubblicato. Il pulsante c'era, in
    // rete, da nove minuti: era la sua App a eseguire ancora il codice
    // vecchio, e niente glielo diceva.
    //
    // Il meccanismo di prima aveva due buchi:
    //  1. `hasController` si leggeva al caricamento della pagina. Se quel
    //     caricamento non aveva un service worker attivo, la variabile
    //     restava falsa PER SEMPRE, e il ricaricamento non avveniva mai.
    //  2. il controllo girava solo su un timer, e iOS sospende i timer di
    //     una PWA in secondo piano. Tornando sull'App si continuava con
    //     il codice vecchio finché il timer non si svegliava.
    //
    // Adesso: si controlla anche quando l'App torna in primo piano, e
    // quando c'è una versione nuova COMPARE UNA RIGA che lo dice. Non si
    // ricarica di nascosto: un ricaricamento a sorpresa mentre stai
    // scrivendo una scheda è peggio del problema che risolve.
    //
    // ------------------------------------------------------------
    // 23 SETTEMBRE 2026 — «L'APP NON SI APRE, SCHERMO NERO»
    //
    // La riga qui sopra — «non si ricarica di nascosto» — era vera
    // nelle intenzioni e falsa nei fatti. Il service worker faceva
    // `skipWaiting()` appena installato: prendeva il comando di
    // un'App APERTA, e un istante dopo cancellava le cache vecchie.
    // A una pagina viva veniva tolto il pavimento da sotto, e al
    // primo file che le serviva — un'icona, un font, un pezzo
    // caricato al momento — schermo nero.
    //
    // L'avviso qui sotto non faceva in tempo a comparire: il
    // ricambio avveniva prima che ci fosse qualcosa da toccare.
    // Una porta che c'era e che nessuno riusciva ad aprire.
    //
    // Adesso la versione nuova ASPETTA. L'avviso compare davvero, e
    // il ricambio parte da un dito su quella riga — a lezione
    // finita, non a metà. E se malgrado tutto la schermata resta
    // vuota, l'App si ripara da sola invece di aspettare che
    // qualcuno sappia come si svuota la cache di una PWA.
    // ============================================================
    (function () {
      var SEGNO = 'essere-riparato';
      var ricaricato = false;

      function vuota() {
        var r = document.getElementById('root');
        return !r || r.childElementCount === 0;
      }

      function ricarica() {
        if (ricaricato) return;
        ricaricato = true;
        window.location.reload();
      }

      // La rete di sicurezza. Se la schermata è ancora vuota vuol dire
      // che qualcosa è rimasto a metà fra due versioni: si butta via
      // tutto e si riparte. UNA volta sola — il segno in sessionStorage
      // impedisce il giro infinito, che sarebbe peggio dello schermo
      // nero perché non lo vedresti nemmeno.
      function riparaUnaVolta() {
        try {
          if (sessionStorage.getItem(SEGNO)) return;
          sessionStorage.setItem(SEGNO, '1');
        } catch (e) { return; }
        var lavori = [];
        if (window.caches && caches.keys) {
          lavori.push(caches.keys().then(function (nomi) {
            return Promise.all(nomi.map(function (n) { return caches.delete(n); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          lavori.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(lavori).then(ricarica).catch(ricarica);
        // Se una delle pulizie si pianta, si riparte lo stesso.
        setTimeout(ricarica, 4000);
      }

      function mostraAvviso(reg) {
        if (document.getElementById('essere-aggiornamento')) return;
        var b = document.createElement('div');
        b.id = 'essere-aggiornamento';
        b.setAttribute('role', 'status');
        b.style.cssText = [
          'position:fixed', 'left:16px', 'right:16px',
          'bottom:calc(env(safe-area-inset-bottom, 0px) + 84px)',
          'z-index:2147483647', 'display:flex', 'align-items:center', 'gap:10px',
          'padding:12px 16px', 'border-radius:14px',
          'background:#1c1c1e', 'border:1px solid #E63946',
          'box-shadow:0 8px 24px rgba(0,0,0,.45)',
          'font:600 14px/1.35 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif',
          'color:#fff', 'cursor:pointer'
        ].join(';');
        b.innerHTML =
          '<span style="font-size:18px;line-height:1">↻</span>' +
          '<span style="flex:1">C’è una versione nuova dell’App.' +
          '<br><span style="font-weight:400;opacity:.75">Tocca qui per aggiornare.</span></span>';
        b.addEventListener('click', function () {
          b.style.opacity = '.5';
          // Qui c'era solo un `reload()`. Non bastava: la versione nuova
          // adesso aspetta, e finché non le si dice di passare avanti un
          // ricaricamento ripresenta la stessa versione di prima.
          // Le si dice, e si ricarica quando ha preso il comando davvero
          // — così la pagina nuova parte con i file nuovi, tutti insieme.
          var atteso = reg && reg.waiting;
          if (!atteso) { ricarica(); return; }
          navigator.serviceWorker.addEventListener('controllerchange', ricarica);
          atteso.postMessage({ type: 'SKIP_WAITING' });
          // Se il cambio non arriva, si ricarica lo stesso: meglio una
          // versione vecchia che un dito premuto a vuoto.
          setTimeout(ricarica, 3000);
        });
        document.body.appendChild(b);
      }

      window.addEventListener('load', function () {
        // Prima di ogni altra cosa: l'App è partita?
        setTimeout(function () {
          if (vuota()) riparaUnaVolta();
          else { try { sessionStorage.removeItem(SEGNO); } catch (e) {} }
        }, 15000);

        if (!('serviceWorker' in navigator)) return;
        // `updateViaCache: 'none'` non e' un dettaglio: senza, il browser
        // controlla se c'e' un service worker nuovo LEGGENDOLO DALLA
        // PROPRIA CACHE HTTP. Il 13 settembre 2026 sw.js veniva servito
        // con «immutable, un anno»: in firebase.json la regola generica
        // per i file .js stava DOPO quella specifica e la sovrascriveva.
        // Risultato: ogni `reg.update()` rileggeva gli stessi byte
        // vecchi, non trovava mai niente di nuovo, e la fascia «c'e' una
        // versione nuova» non poteva comparire nemmeno una volta.
        // Il meccanismo era giusto e non veniva mai interpellato.
        // Con questo, il controllo va SEMPRE in rete.
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function (reg) {
          // Una versione nuova già pronta e in attesa: lo si dice subito.
          if (reg.waiting && navigator.serviceWorker.controller) mostraAvviso(reg);

          reg.addEventListener('updatefound', function () {
            var nuovo = reg.installing;
            if (!nuovo) return;
            // Si legge QUI se la pagina è già controllata, non dentro lo
            // statechange: il service worker fa `skipWaiting` e `claim`, e
            // dopo l'attivazione il controller esiste SEMPRE — anche alla
            // prima installazione. Leggerlo dopo vorrebbe dire annunciare
            // «versione nuova» a chi apre l'App per la prima volta.
            // (Trovato dal controllo in Chromium, non a ragionamento.)
            var eAggiornamento = !!navigator.serviceWorker.controller;
            nuovo.addEventListener('statechange', function () {
              if (nuovo.state === 'installed' && eAggiornamento) mostraAvviso(reg);
            });
          });

          var controlla = function () { try { reg.update(); } catch (e) {} };
          setInterval(controlla, 60000);
          // iOS sospende i timer in secondo piano: il controllo che conta
          // è quello al rientro.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') controlla();
          });
          window.addEventListener('focus', controlla);
        }).catch(function () { /* senza service worker l'App funziona lo stesso */ });
      });
    })();
  </script>
</body>
</html>
