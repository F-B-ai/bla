name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, test, security greps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fitness-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p . || true
        # NOTA: || true finché non si sana il debito DOM-lib pre-esistente
        # (window/document in file web-only). Da rimuovere appena pulito:
        # il typecheck deve tornare bloccante.

      - name: Test (logica pura src/domain)
        run: npx jest --ci

      - name: Guardiano palette (M2 — niente nuovi colori fuori tema)
        run: node scripts/check-colors.js

      - name: Grep anti-regressione — managedPassword (V1)
        run: |
          # Cattura USI del campo (scrittura "managedPassword:" o lettura
          # ".managedPassword"), non le semplici menzioni nei commenti.
          if grep -rnE "managedPassword\s*[:=]|\.managedPassword" src/ --include="*.ts" --include="*.tsx"; then
            echo "::error::managedPassword è riapparso nel codice client — vulnerabilità V1"
            exit 1
          fi
          echo "OK: nessun uso di managedPassword nel client"

      - name: Grep anti-regressione — segreti hardcoded
        run: |
          if grep -rn "sk-ant-api" src/ --include="*.ts" --include="*.tsx"; then
            echo "::error::Possibile chiave Anthropic hardcoded nel client"
            exit 1
          fi
          if ls firebase-sa-key.json 2>/dev/null; then
            echo "::error::Chiave service account committata nel repo"
            exit 1
          fi
          echo "OK: nessun segreto hardcoded"

      - name: Audit dipendenze (high)
        run: npm audit --audit-level=high || true
        # || true: al primo giro si fa il censimento; diventa bloccante
        # dopo la pulizia delle vulnerabilità ereditate.
