# ============================================================
# DEPLOY ESSĒRE — pubblica app + regole su Firebase Hosting.
#
# QUANDO SCATTA (mai per sbaglio):
#  - push il cui messaggio di commit contiene "[deploy]"
#  - oppure avvio manuale dalla tab Actions (workflow_dispatch)
#
# COSA SERVE (una tantum): il secret FIREBASE_SERVICE_ACCOUNT
# in Settings → Secrets and variables → Actions, con dentro il
# JSON completo del service account di essere-3fe6f.
# Da quel momento: nessuna chiave passa più in chat.
# ============================================================
name: Deploy to Firebase (ESSĒRE)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - claude/fitness-coaching-app-*

concurrency:
  group: firebase-deploy-essere
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # push: solo se il commit dice esplicitamente [deploy];
    # l'avvio manuale da Actions passa sempre.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fitness-app/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: fitness-app

      - name: Gate di qualità (test + palette)
        run: |
          npx jest --ci --silent
          node scripts/check-colors.js
        working-directory: fitness-app

      - name: Build web app (brand ESSĒRE)
        run: npm run build:web
        working-directory: fitness-app

      - name: Write service account key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT mancante: aggiungilo in Settings → Secrets → Actions."
            exit 1
          fi
          node -e "
            const sa = JSON.parse(process.env.FIREBASE_SA);
            if (sa.project_id !== 'essere-3fe6f') { throw new Error('La chiave non è del progetto essere-3fe6f: ' + sa.project_id); }
            require('fs').writeFileSync('/tmp/firebase_sa.json', JSON.stringify(sa));
            console.log('SA ok:', sa.client_email);
          "

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase_sa.json
        run: npx firebase-tools deploy --only hosting --project essere-3fe6f --non-interactive
        working-directory: fitness-app

      - name: Deploy Firestore rules + indexes (retry sul 409)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase_sa.json
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project essere-3fe6f --non-interactive \
            || (echo "retry tra 10s (release contesa)…" && sleep 10 && \
                npx firebase-tools deploy --only firestore:rules,firestore:indexes --project essere-3fe6f --non-interactive)
        working-directory: fitness-app

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/firebase_sa.json
