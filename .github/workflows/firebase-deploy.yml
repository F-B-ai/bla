name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
      - claude/fitness-coaching-app-*

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fitness-app/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: fitness-app

      - name: Build web app
        run: npm run build:web
        working-directory: fitness-app

      - name: Write service account key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node -e "require('fs').writeFileSync('/tmp/firebase_sa.json', process.env.FIREBASE_SA)"

      - name: Deploy Firestore & Storage rules
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage:rules --project essere-3fe6f --force
        working-directory: fitness-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase_sa.json
        continue-on-error: true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: essere-3fe6f
          entryPoint: fitness-app
